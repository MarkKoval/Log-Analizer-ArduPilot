<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результати аналізу</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Результати аналізу</h1>
        <a href="{{ url_for('upload_file') }}" class="back-link">← На головну</a>
        
        <div class="section">
            <h2>Основні параметри польоту</h2>
            <div class="stats-grid">
                {% for key, value in basic_stats.items() %}
                <div class="stat-card">
                    <h3>{{ key|replace('_', ' ')|title }}</h3>
                    <p>{{ value }}</p>
                </div>
                {% endfor %}
            </div>
        </div>
        
        <div class="section">
            <h2>Графіки польоту</h2>
            <div class="graphs">
                {% if graphs.altitude %}
                <div class="graph">
                    <img src="data:image/png;base64,{{ graphs.altitude }}" alt="Висота польоту">
                </div>
                {% endif %}
                
                {% if graphs.speed %}
                <div class="graph">
                    <img src="data:image/png;base64,{{ graphs.speed }}" alt="Швидкість польоту">
                </div>
                {% endif %}
            </div>
        </div>
        
        <div class="section">
    <h2>Розширений аналіз (ШІ)</h2>

     
</div>
    </div>
</body>
</html>
